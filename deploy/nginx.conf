# DSR portal — public intake form at /, internal console at /admin.
#
# The API listens on 127.0.0.1:3000 only; nginx is the sole public entrance.
# Public and internal API paths are proxied separately so an edge WAF can
# treat them differently, and /internal is where extra rate limiting lands.

limit_req_zone $binary_remote_addr zone=dsr_public:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=dsr_general:10m rate=120r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Reverse-proxy and static hosting only; no autoindex, no version banner.
    server_tokens off;
    client_max_body_size 16m;   # above the app's 15 MB cap, so the app returns the error

    # Baseline security headers (spec section 9). HSTS is added with TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # ------------------------------------------------------------------ API --
    location /public/ {
        limit_req zone=dsr_public burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /internal/ {
        limit_req zone=dsr_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------- internal console --
    location /admin {
        alias /var/www/dsr/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # The console must never be cached by shared proxies.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /admin/assets/ {
        alias /var/www/dsr/admin/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------- public portal --
    location /assets/ {
        root /var/www/dsr/public-form;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Form schemas change with each import, so revalidate rather than cache hard.
    location /form-schema/ {
        root /var/www/dsr/public-form;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /var/www/dsr/public-form;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # SAMEORIGIN, not DENY: the form builder embeds this page as its live
        # preview canvas. Third-party framing stays blocked, and the admin
        # console below remains DENY.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # The replica renders vendored stylesheets and base64 logos, so inline
        # styles and data: images are required; scripts stay same-origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }
}
